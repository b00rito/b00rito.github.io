title: Hacker-Blog
description: "A Jekyll Blog Theme For Hackers"
author:
  name: "SomeHacker"
  email: "someone@somewebsite.somedomain"
  url: "https://ashishchaudhary.in/hacker-blog"

baseurl: /

source: .
destination: ./_site
permalink: /:title
paginate: 3
paginate_path: /page/:num/

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

future: true
plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

# Custom variables
owner : "SomeHacker"
year : "2020"

# GoatCounter analytics - set to your site code (the part before
# ".goatcounter.com" when you sign up at https://www.goatcounter.com/).
# Leave blank to disable.
goatcounter : "b00rito"

# Google Analytics 4 - set to your Measurement ID (looks like "G-XXXXXXXXXX")
# from a GA4 property at https://analytics.google.com/. Leave blank to disable.
google_analytics : "G-G9ZNSGHD8X"
